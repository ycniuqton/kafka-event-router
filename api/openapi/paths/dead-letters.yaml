routeDLQ:
  get:
    tags: [dead-letters]
    operationId: listRouteDeadLetters
    summary: Unresolved dead letters of a route (DLQ topics of all versions), newest first.
    description: |
      Requires `dlq.read`. Reads DLQ topics on demand with manual assignment and no consumer group.
      A scan is bounded by 10 s / 10 MiB; `truncated=true` means the budget stopped it and `next_cursor` continues.
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "#/components/parameters/DLQLimit"
      - $ref: "../components/params.yaml#/Cursor"
      - $ref: "#/components/parameters/ErrorType"
      - $ref: "#/components/parameters/Since"
      - $ref: "#/components/parameters/Until"
      - $ref: "#/components/parameters/Step"
      - $ref: "#/components/parameters/Version"
      - $ref: "#/components/parameters/Text"
      - $ref: "#/components/parameters/IncludeResolved"
      - $ref: "#/components/parameters/ErrorClass"
      - $ref: "#/components/parameters/Fingerprint"
    responses:
      "200":
        description: One page.
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterPage" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "401": { $ref: "../components/problem.yaml#/responses/Unauthenticated" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "503": { $ref: "../components/problem.yaml#/responses/Unavailable" }
routeDLQSummary:
  get:
    tags: [dead-letters]
    operationId: getRouteDeadLetterSummary
    summary: Unresolved counts of a route (tab label, dashboard card); cached 15 s.
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
    responses:
      "200":
        description: The summary.
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterSummary" } } }
      "401": { $ref: "../components/problem.yaml#/responses/Unauthenticated" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
routeDLQItem:
  get:
    tags: [dead-letters]
    operationId: getRouteDeadLetter
    summary: One dead letter with original key, value, headers and failure details.
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "#/components/parameters/DLQId"
    responses:
      "200":
        description: The detail.
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterDetail" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "401": { $ref: "../components/problem.yaml#/responses/Unauthenticated" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
routeDLQRetry:
  post:
    tags: [dead-letters]
    operationId: retryRouteDeadLetters
    summary: Re-run selected dead letters through the route's active version and produce to the destination (≤ 500 per call).
    description: |
      Requires `dlq.act`. Sent and filtered events become resolved; failed events stay and are only reported.
      409 with `code: replay_approval_required` when the strict 4-eyes gate holds the replay back (request approval with a job).
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "../components/params.yaml#/CSRFToken"
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterSelection" } } }
    responses:
      "200":
        description: Per-event outcomes.
        content: { application/json: { schema: { $ref: "#/components/schemas/RetryReport" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "409":
        $ref: "../components/problem.yaml#/responses/Conflict"
      "422": { $ref: "../components/problem.yaml#/responses/ValidationFailed" }
routeDLQDiscard:
  post:
    tags: [dead-letters]
    operationId: discardRouteDeadLetters
    summary: Mark selected dead letters discarded (≤ 500 per call).
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "../components/params.yaml#/CSRFToken"
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterSelection" } } }
    responses:
      "200":
        description: The result.
        content: { application/json: { schema: { $ref: "#/components/schemas/DiscardReport" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "409": { $ref: "../components/problem.yaml#/responses/Conflict" }
      "422": { $ref: "../components/problem.yaml#/responses/ValidationFailed" }
routeDLQExport:
  get:
    tags: [dead-letters]
    operationId: exportRouteDeadLetters
    summary: Download selected (`ids`) or filtered dead letters as a JSON array of detail objects (≤ 10,000).
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - name: ids
        in: query
        schema: { type: string }
        description: Comma-separated dead-letter ids; when absent the filters select.
      - $ref: "#/components/parameters/ErrorType"
      - $ref: "#/components/parameters/Since"
      - $ref: "#/components/parameters/Until"
      - $ref: "#/components/parameters/Step"
      - $ref: "#/components/parameters/Version"
      - $ref: "#/components/parameters/Text"
      - $ref: "#/components/parameters/ErrorClass"
      - $ref: "#/components/parameters/Fingerprint"
      - name: format
        in: query
        schema: { type: string, enum: [json, ndjson], default: json }
    responses:
      "200":
        description: "The file (`Content-Disposition: attachment`); values masked per SampleVisibility."
        content:
          application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DeadLetterDetail" } } }
          application/x-ndjson: { schema: { type: string, description: "One DeadLetterDetail JSON object per line." } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "422": { $ref: "../components/problem.yaml#/responses/ValidationFailed" }
routeDLQRestore:
  post:
    tags: [dead-letters]
    operationId: restoreRouteDeadLetters
    summary: Un-resolve discarded dead letters still inside DLQ retention (≤ 500 per call, P2).
    description: Requires `dlq.act`. Non-discarded events are skipped (`not_discarded`), expired ones (`expired`). Audited as `dlq.restored`.
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "../components/params.yaml#/CSRFToken"
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterSelection" } } }
    responses:
      "200":
        description: The result.
        content: { application/json: { schema: { $ref: "#/components/schemas/RestoreReport" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "422": { $ref: "../components/problem.yaml#/responses/ValidationFailed" }
routeDLQJobs:
  get:
    tags: [dead-letters]
    operationId: listRouteDeadLetterJobs
    summary: Newest bulk jobs of a route (P2).
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
    responses:
      "200":
        description: Up to 20 jobs, newest first.
        content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DeadLetterJob" } } } } } }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
  post:
    tags: [dead-letters]
    operationId: createRouteDeadLetterJob
    summary: Queue a background retry/discard of every unresolved dead letter matching a filter (any size, P2).
    description: Requires `dlq.act`. Runners in every API instance claim jobs (SKIP LOCKED), apply pages of ≤ 500 and keep a resumable cursor.
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "../components/params.yaml#/CSRFToken"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            description: "Exactly one of `match` (default: every unresolved event) or `ids` (at most 10,000)."
            properties:
              action: { type: string, enum: [retry, discard] }
              match: { $ref: "#/components/schemas/Match" }
              ids: { type: array, items: { type: string }, maxItems: 10000 }
              ratePerSecond: { type: integer, minimum: 1, maximum: 1000, default: 50, description: "Replay rate limit (retry jobs; discard jobs are not throttled)." }
              note: { type: string, maxLength: 2000 }
    responses:
      "202":
        description: "The job: queued, or pending_approval when the strict 4-eyes gate holds the replay back."
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterJob" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "409": { $ref: "../components/problem.yaml#/responses/Conflict" }
dlqJob:
  get:
    tags: [dead-letters]
    operationId: getDeadLetterJob
    summary: Status and progress of a bulk job.
    parameters:
      - $ref: "#/components/parameters/JobId"
    responses:
      "200":
        description: The job.
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterJob" } } }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
dlqJobCancel:
  post:
    tags: [dead-letters]
    operationId: cancelDeadLetterJob
    summary: Cancel a job (queued → cancelled at once; running → stops after the current page).
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "../components/params.yaml#/CSRFToken"
    responses:
      "200":
        description: The job.
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterJob" } } }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
dlqJobApprove:
  post:
    tags: [dead-letters]
    operationId: approveDeadLetterJob
    summary: Approve a replay waiting for a second person (pending_approval → queued).
    description: Requires `deployment.approve` on the route's team; the requester can never approve (403 `self_approval`, admins included). Audited as `dlq.replay_approved`.
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "../components/params.yaml#/CSRFToken"
    requestBody:
      content: { application/json: { schema: { $ref: "#/components/schemas/DecisionBody" } } }
    responses:
      "200":
        description: The job.
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterJob" } } }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "409": { $ref: "../components/problem.yaml#/responses/Conflict" }
dlqJobReject:
  post:
    tags: [dead-letters]
    operationId: rejectDeadLetterJob
    summary: Reject a replay waiting for a second person (pending_approval → rejected; a stored edit is dropped).
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "../components/params.yaml#/CSRFToken"
    requestBody:
      content: { application/json: { schema: { $ref: "#/components/schemas/DecisionBody" } } }
    responses:
      "200":
        description: The job.
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterJob" } } }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "409": { $ref: "../components/problem.yaml#/responses/Conflict" }
dlqJobs:
  get:
    tags: [dead-letters]
    operationId: listPendingDeadLetterJobs
    summary: Replays waiting for approval on routes the caller may read (oldest first).
    parameters:
      - name: status
        in: query
        schema: { type: string, enum: [pending_approval] }
    responses:
      "200":
        description: The pending jobs.
        content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DeadLetterJob" } } } } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "401": { $ref: "../components/problem.yaml#/responses/Unauthenticated" }
routeDLQGroups:
  get:
    tags: [dead-letters]
    operationId: listRouteDeadLetterGroups
    summary: Cause groups of a route's unresolved dead letters (fingerprint = route + step + error type + normalized message).
    description: Requires `dlq.read`. Scans up to 10,000 newest records (cached 15 s); `approximate` when the scan did not cover the whole DLQ.
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "#/components/parameters/ErrorType"
      - $ref: "#/components/parameters/ErrorClass"
      - $ref: "#/components/parameters/Since"
      - $ref: "#/components/parameters/Until"
    responses:
      "200":
        description: Groups by count.
        content: { application/json: { schema: { $ref: "#/components/schemas/GroupPage" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
globalDLQGroups:
  get:
    tags: [dead-letters]
    operationId: listDeadLetterGroups
    summary: Cause groups across every route the caller may read (at most 2,000 newest records per route).
    parameters:
      - $ref: "#/components/parameters/ErrorType"
      - $ref: "#/components/parameters/ErrorClass"
      - $ref: "#/components/parameters/Since"
      - $ref: "#/components/parameters/Until"
      - name: routeId
        in: query
        schema: { type: string }
        description: Comma-separated route ids to restrict to.
    responses:
      "200":
        description: Groups by count; failing routes are listed in `warnings`.
        content: { application/json: { schema: { $ref: "#/components/schemas/GroupPage" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "401": { $ref: "../components/problem.yaml#/responses/Unauthenticated" }
routeDLQReplay:
  post:
    tags: [dead-letters]
    operationId: replayRouteDeadLetter
    summary: Dry-run or replay one dead letter, optionally edited, through the route's active version.
    description: |
      Requires `dlq.act`. Masked editors edit the masked view; leaves left at their mask are restored server side.
      A replay of an edited event is audited as `dlq.edited_replayed` with the changed paths (never values); dry runs as
      `dlq.replay_previewed`. Avro/Protobuf payloads are not editable (422 `edit_unsupported_format`).
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "#/components/parameters/DLQId"
      - $ref: "../components/params.yaml#/CSRFToken"
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ReplayRequest" } } }
    responses:
      "200":
        description: The dry run (`dryRun=true`, `result`) or the done replay (`status=done`, `report`).
        content: { application/json: { schema: { $ref: "#/components/schemas/ReplayResponse" } } }
      "202":
        description: Held back by the strict 4-eyes gate (`status=pending_approval`, `job`).
        content: { application/json: { schema: { $ref: "#/components/schemas/ReplayResponse" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "409": { $ref: "../components/problem.yaml#/responses/Conflict" }
      "422": { $ref: "../components/problem.yaml#/responses/ValidationFailed" }
routeDLQDryRun:
  post:
    tags: [dead-letters]
    operationId: dryRunRouteDeadLetters
    summary: Run up to 20 newest events of a selection or cause group through the active version without producing.
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "../components/params.yaml#/CSRFToken"
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterSelection" } } }
    responses:
      "200":
        description: The sample's outcomes.
        content: { application/json: { schema: { $ref: "#/components/schemas/DryRunReport" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "409": { $ref: "../components/problem.yaml#/responses/Conflict" }
routeDLQStudio:
  post:
    tags: [dead-letters]
    operationId: openDeadLetterInStudio
    summary: Create a preview sample session holding this dead letter and return the builder deep link.
    parameters:
      - $ref: "../components/params.yaml#/IdParam"
      - $ref: "#/components/parameters/DLQId"
      - $ref: "../components/params.yaml#/CSRFToken"
    responses:
      "200":
        description: The link.
        content: { application/json: { schema: { $ref: "#/components/schemas/StudioLink" } } }
      "403": { $ref: "../components/problem.yaml#/responses/Forbidden" }
      "404": { $ref: "../components/problem.yaml#/responses/NotFound" }
      "503": { $ref: "../components/problem.yaml#/responses/Unavailable" }
globalDLQ:
  get:
    tags: [dead-letters]
    operationId: listDeadLetters
    summary: Dead letters across every route the caller may read, merged newest first.
    parameters:
      - $ref: "#/components/parameters/DLQLimit"
      - $ref: "../components/params.yaml#/Cursor"
      - $ref: "#/components/parameters/ErrorType"
      - $ref: "#/components/parameters/Since"
      - $ref: "#/components/parameters/Until"
      - $ref: "#/components/parameters/Step"
      - $ref: "#/components/parameters/Version"
      - $ref: "#/components/parameters/Text"
      - $ref: "#/components/parameters/IncludeResolved"
      - $ref: "#/components/parameters/ErrorClass"
      - $ref: "#/components/parameters/Fingerprint"
      - name: routeId
        in: query
        schema: { type: string }
        description: Comma-separated route ids to restrict to.
    responses:
      "200":
        description: One page; routes whose DLQ could not be read are listed in `warnings`.
        content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterPage" } } }
      "400": { $ref: "../components/problem.yaml#/responses/BadRequest" }
      "401": { $ref: "../components/problem.yaml#/responses/Unauthenticated" }
globalDLQSummary:
  get:
    tags: [dead-letters]
    operationId: getDeadLetterSummary
    summary: Unresolved total for the nav badge, per route.
    responses:
      "200":
        description: The summary.
        content:
          application/json:
            schema:
              type: object
              required: [unresolved, byErrorType, approximate, routes]
              properties:
                unresolved: { type: integer }
                byErrorType: { type: object, additionalProperties: { type: integer } }
                approximate: { type: boolean }
                routes:
                  type: array
                  items:
                    type: object
                    required: [routeId, routeName, unresolved, byErrorType, approximate]
                    properties:
                      routeId: { type: string }
                      routeName: { type: string }
                      unresolved: { type: integer }
                      byErrorType: { type: object, additionalProperties: { type: integer } }
                      approximate: { type: boolean }
      "401": { $ref: "../components/problem.yaml#/responses/Unauthenticated" }
components:
  parameters:
    DLQLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    DLQId:
      name: dlqId
      in: path
      required: true
      schema: { type: string }
      description: Opaque dead-letter id (base64url of DLQ topic, partition and offset).
    ErrorType:
      name: errorType
      in: query
      schema: { type: string, example: "step_error,timeout" }
      description: Comma-separated error types.
    Step:
      name: step
      in: query
      schema: { type: string }
      description: Failing step id (exact).
    Version:
      name: version
      in: query
      schema: { type: integer, minimum: 1 }
      description: Route version that wrote the dead letter.
    Text:
      name: q
      in: query
      schema: { type: string }
      description: Case-insensitive text in the error message.
    IncludeResolved:
      name: includeResolved
      in: query
      schema: { type: boolean, default: false }
      description: Also list retried/filtered/discarded events with their resolution.
    ErrorClass:
      name: class
      in: query
      schema: { type: string, example: "router,data" }
      description: Comma-separated error classes (data, router, transient).
    Fingerprint:
      name: fingerprint
      in: query
      schema: { type: string, pattern: "^[0-9a-f]{16}$" }
      description: Cause group fingerprint (from the groups endpoints).
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Since:
      name: since
      in: query
      schema: { type: string, format: date-time }
    Until:
      name: until
      in: query
      schema: { type: string, format: date-time }
  schemas:
    ErrorType:
      type: string
      enum: [decode_error, step_error, timeout, output_invalid, lookup_unavailable, dependency_unavailable, produce_retriable,
        internal_error, sandbox_crash, encode_error, produce_error, config_error, unknown]
    ErrorClass:
      type: string
      enum: [data, router, transient]
      description: "Whose fault: bad input data, a router bug, or a transient condition (pure function of the error type)."
    SourcePosition:
      type: object
      required: [topic, partition, offset]
      properties:
        topic: { type: string }
        partition: { type: integer }
        offset: { type: integer, format: int64 }
    Destination:
      type: object
      required: [topic, partition, offset]
      properties:
        topic: { type: string }
        partition: { type: integer }
        offset: { type: integer, format: int64 }
    Resolution:
      type: [object, "null"]
      required: [state, by, at]
      properties:
        state: { type: string, enum: [retried, filtered, discarded] }
        by: { type: string }
        at: { type: string, format: date-time }
        destination: { $ref: "#/components/schemas/Destination" }
        jobId: { type: string }
    DeadLetter:
      type: object
      required: [id, routeId, routeName, failedAt, errorType, message, step, stepLabel, branch, versionNo, source, resolution]
      properties:
        id: { type: string }
        routeId: { type: string }
        routeName: { type: string }
        failedAt: { type: string, format: date-time }
        errorType: { $ref: "#/components/schemas/ErrorType" }
        message: { type: string }
        step: { type: string }
        stepLabel: { type: string, description: "Human label of the failing step (\"Step 2 · JavaScript\"); the step id when unknown." }
        branch: { type: string }
        versionNo: { type: integer }
        source: { $ref: "#/components/schemas/SourcePosition" }
        resolution: { $ref: "#/components/schemas/Resolution" }
        deliveryMode: { type: string, enum: [at_least_once, exactly_once], description: "Delivery mode of the route's active version (absent for undeployed routes); retries of exactly_once routes are delivered at-least-once (P3)." }
        errorClass: { $ref: "#/components/schemas/ErrorClass" }
        fingerprint: { type: string, description: Cause group fingerprint. }
        attempts: { type: integer, description: "Delayed retry attempts of the route's auto-retry policy before the event was parked." }
    EncodedValue:
      type: object
      required: [encoding, data]
      properties:
        encoding: { type: string, enum: [json, utf8, base64, avro, protobuf] }
        data: {}
        schemaId: { type: integer, description: "Registry schema id of avro/protobuf values." }
    EncodedHeader:
      type: object
      required: [key, value, encoding]
      properties:
        key: { type: string }
        value: { type: string }
        encoding: { type: string, enum: [utf8, base64] }
    DeadLetterDetail:
      allOf:
        - $ref: "#/components/schemas/DeadLetter"
        - type: object
          required: [stack, key, value, headers, masked]
          properties:
            stack: { type: string }
            key: { $ref: "#/components/schemas/EncodedValue" }
            value: { $ref: "#/components/schemas/EncodedValue" }
            headers: { type: array, items: { $ref: "#/components/schemas/EncodedHeader" } }
            masked: { type: boolean }
    DeadLetterPage:
      type: object
      description: Cursor page (`next_cursor` as in PageMeta) plus scan statistics.
      required: [items, next_cursor, scanned, truncated]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DeadLetter" } }
        next_cursor: { type: [string, "null"] }
        scanned: { type: integer }
        truncated: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [reason]
            properties:
              routeId: { type: string }
              reason: { type: string, enum: [dlq_topic_missing, scan_failed] }
    DeadLetterSummary:
      type: object
      required: [unresolved, byErrorType, oldestAt, newestAt, approximate]
      properties:
        unresolved: { type: integer }
        byErrorType: { type: object, additionalProperties: { type: integer } }
        oldestAt: { type: [string, "null"], format: date-time }
        newestAt: { type: [string, "null"], format: date-time }
        approximate: { type: boolean }
        byErrorClass: { type: object, additionalProperties: { type: integer } }
    DeadLetterSelection:
      type: object
      description: Exactly one of `ids` or `match`.
      properties:
        ids: { type: array, items: { type: string }, maxItems: 500 }
        match: { $ref: "#/components/schemas/Match" }
        expectedCount: { type: integer, description: "409 when the matching count changed." }
    Match:
      type: object
      properties:
        errorType: { type: array, items: { $ref: "#/components/schemas/ErrorType" } }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        step: { type: string }
        version: { type: integer }
        q: { type: string }
        includeResolved: { type: boolean }
        errorClass: { type: array, items: { $ref: "#/components/schemas/ErrorClass" } }
        fingerprint: { type: string }
    DeadLetterJob:
      type: object
      required: [jobId, routeId, action, status, total, processed, counts, createdAt]
      properties:
        jobId: { type: string }
        routeId: { type: string }
        routeName: { type: string }
        action: { type: string, enum: [retry, discard] }
        match: { type: object }
        status: { type: string, enum: [queued, running, cancel_requested, cancelled, succeeded, failed, pending_approval, rejected] }
        total: { type: integer }
        processed: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
        error: { type: string }
        requestedBy: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        ratePerSecond: { type: integer }
        note: { type: string }
        edited: { type: boolean, description: "A single edited replay (the edit stays server side until the job ends)." }
        idsCount: { type: integer, description: "Number of explicit ids of an ids selection (ids are not echoed)." }
        requestedByMe: { type: boolean, description: "The caller requested this job (Approve/Reject are hidden)." }
        approval:
          type: object
          required: [required]
          properties:
            required: { type: boolean }
            decidedBy: { type: string }
            decidedAt: { type: string, format: date-time }
            decisionNote: { type: string }
    DecisionBody:
      type: object
      properties:
        note: { type: string, maxLength: 2000 }
    CauseGroup:
      type: object
      required: [fingerprint, routeId, routeName, step, stepLabel, errorType, errorClass, pattern, count, firstSeenAt, lastSeenAt, versions, sample, trend]
      properties:
        fingerprint: { type: string }
        routeId: { type: string }
        routeName: { type: string }
        step: { type: string }
        stepLabel: { type: string }
        errorType: { $ref: "#/components/schemas/ErrorType" }
        errorClass: { $ref: "#/components/schemas/ErrorClass" }
        pattern: { type: string, description: "Normalized message: ids, numbers, offsets and positions replaced by <id>, <n>, <uuid>, <hex>, <ts>." }
        count: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        versions: { type: array, items: { type: integer } }
        sample:
          type: object
          required: [id, message, failedAt]
          properties:
            id: { type: string }
            message: { type: string }
            failedAt: { type: string, format: date-time }
        trend:
          type: object
          required: [since, bucketSeconds, counts]
          properties:
            since: { type: string, format: date-time }
            bucketSeconds: { type: integer }
            counts: { type: array, items: { type: integer } }
    GroupPage:
      type: object
      required: [items, scanned, truncated, approximate, byClass]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CauseGroup" } }
        scanned: { type: integer }
        truncated: { type: boolean }
        approximate: { type: boolean }
        byClass: { type: object, additionalProperties: { type: integer } }
        warnings:
          type: array
          items:
            type: object
            required: [reason]
            properties:
              routeId: { type: string }
              reason: { type: string, enum: [dlq_topic_missing, scan_failed] }
    RecordEdit:
      type: object
      description: Replacement key, value and headers; an omitted member keeps the original.
      properties:
        key: { $ref: "#/components/schemas/EncodedValue" }
        value: { $ref: "#/components/schemas/EncodedValue" }
        headers: { type: array, items: { $ref: "#/components/schemas/EncodedHeader" } }
    ReplayRequest:
      type: object
      properties:
        edit: { $ref: "#/components/schemas/RecordEdit" }
        dryRun: { type: boolean, default: false }
        note: { type: string, maxLength: 2000 }
    DiffEntry:
      type: object
      required: [path, op]
      properties:
        path: { type: string, example: "/value/items/0" }
        op: { type: string, enum: [add, remove, replace] }
    OutputView:
      type: object
      required: [branch, connectionId, topic, key, value, headers]
      properties:
        branch: { type: string }
        connectionId: { type: string }
        topic: { type: string }
        key: { oneOf: [{ $ref: "#/components/schemas/EncodedValue" }, { type: "null" }] }
        value: { $ref: "#/components/schemas/EncodedValue" }
        headers: { type: array, items: { $ref: "#/components/schemas/EncodedHeader" } }
    DryRunResult:
      type: object
      required: [id, outcome, outputs]
      properties:
        id: { type: string }
        outcome: { type: string, enum: [would_send, filtered, failed] }
        errorType: { type: string }
        message: { type: string }
        outputs: { type: array, items: { $ref: "#/components/schemas/OutputView" } }
    DryRunReport:
      type: object
      required: [activeVersionNo, sampled, total, results, counts, masked]
      properties:
        activeVersionNo: { type: integer }
        sampled: { type: integer }
        total: { type: integer }
        results: { type: array, items: { $ref: "#/components/schemas/DryRunResult" } }
        counts: { type: object, additionalProperties: { type: integer } }
        masked: { type: boolean }
    ReplayResponse:
      type: object
      required: [dryRun, activeVersionNo, masked, diff]
      properties:
        dryRun: { type: boolean }
        status: { type: string, enum: [done, pending_approval] }
        activeVersionNo: { type: integer }
        masked: { type: boolean }
        diff: { type: array, items: { $ref: "#/components/schemas/DiffEntry" } }
        result: { $ref: "#/components/schemas/DryRunResult" }
        report: { $ref: "#/components/schemas/RetryReport" }
        job: { $ref: "#/components/schemas/DeadLetterJob" }
    RestoreReport:
      type: object
      required: [restored, skipped, remaining]
      properties:
        restored: { type: integer }
        skipped: { type: array, items: { $ref: "#/components/schemas/ItemResult" } }
        failed: { type: array, items: { $ref: "#/components/schemas/ItemResult" } }
        remaining: { type: integer }
        warnings: { type: array, items: { type: string } }
    ItemResult:
      type: object
      required: [id, outcome]
      properties:
        id: { type: string }
        outcome: { type: string, enum: [sent, filtered, failed, skipped, discarded, restored] }
        destination: { $ref: "#/components/schemas/Destination" }
        errorType: { type: string, enum: [step_error, timeout, output_invalid, decode_error, compile, destination, lookup_unavailable, dependency_unavailable] }
        message: { type: string }
        reason: { type: string, enum: [locked, already_resolved, expired, not_found, not_discarded] }
    RetryReport:
      type: object
      required: [activeVersionNo, results, counts, remaining]
      properties:
        activeVersionNo: { type: integer }
        results: { type: array, items: { $ref: "#/components/schemas/ItemResult" } }
        counts: { type: object, additionalProperties: { type: integer } }
        remaining: { type: integer }
        warnings: { type: array, items: { type: string, enum: [state_not_saved] } }
        deliveryMode: { type: string, enum: [at_least_once, exactly_once], description: "Delivery mode of the version the retry ran through (P3)." }
        deliveredAtLeastOnce: { type: boolean, description: "True for exactly_once routes: retries produce outside the route's consumer transaction, so they are delivered at-least-once (P3)." }
    DiscardReport:
      type: object
      required: [discarded, skipped, remaining]
      properties:
        discarded: { type: integer }
        skipped: { type: array, items: { $ref: "#/components/schemas/ItemResult" } }
        failed: { type: array, items: { $ref: "#/components/schemas/ItemResult" } }
        remaining: { type: integer }
        warnings: { type: array, items: { type: string } }
    StudioLink:
      type: object
      required: [sessionId, sampleIndex, builderUrl]
      properties:
        sessionId: { type: string }
        sampleIndex: { type: integer }
        builderUrl: { type: string, example: "/routes/r3/edit?sample=0&session=ses_1&step=transform" }
