openapi: 3.1.0
info:
  title: Event Router API
  version: 0.1.0
  description: |
    Control-plane API. Conventions: JSON only; errors are RFC 7807 `application/problem+json` whose
    `path` members are JSON Pointers; lists use cursor pages `{items, next_cursor}`; versioned resources
    return `ETag` and require `If-Match` on PATCH/PUT/DELETE (428 if missing, 412 if stale).
    Feature folders add `paths/<feature>.yaml` and reference them below.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: auth
    description: Login, session and current principal (platform-core).
  - name: access-control
    description: Users, invitations, role bindings, teams, connection grants, effective access, approvals and the audit log (access-control).
  - name: connections
    description: Saved Kafka clusters, live tests, topic browser and topic creation (connections).
  - name: routes
    description: Routes, drafts, validation, deploys, versions, diff, rollback and bulk actions (routes).
  - name: sandbox
    description: JS sandbox runtime info for the Studio editor (js-sandbox).
  - name: monitoring
    description: Dashboard, recent activity, first-run checklist, route overview metrics, flow map, alert rules, the alerts bell and WS /events (monitoring).
  - name: dead-letters
    description: DLQ browse, detail, retry, discard, export and Open in Studio (dead-letters).
