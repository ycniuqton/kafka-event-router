name: wave2-s2-confirm
description: >
  Wave-2 S2 (fast codec + adaptive in-flight + memory budget): one route, 1 KB, 1-min steps (20 s warm-up, s2-explore
  method). Cases p1/p12 with the default (auto) in-flight limit and with maxInFlight 5000 (auto, cap 5000). Run once per
  ROUTER_ENGINE_CODEC (fast, tree); results are renamed wave2-s2-<codec>.json.
target: local
stopOnKnee: true
criteria: {p99Limit: 1s, lagSlopeAbs: 50, lagSlopeRel: 0.01, warmup: 20s, minSamples: 6}
defaults:
  partitions: 12
  routes: {count: 1}
  load:
    size: 1024
    producers: 3
    lanes: 4
    streams: 512
    steps:
      - {rate: 10000, duration: 1m}
      - {rate: 20000, duration: 1m}
      - {rate: 30000, duration: 1m}
      - {rate: 40000, duration: 1m}
      - {rate: 50000, duration: 1m}
      - {rate: 65000, duration: 1m}
      - {rate: 80000, duration: 1m}
      - {rate: 100000, duration: 1m}
      - {rate: 120000, duration: 1m}
      - {rate: 140000, duration: 1m}
      - {rate: 160000, duration: 1m}
      - {rate: 200000, duration: 1m}
  drain: {timeout: 3m}
cases:
  - {name: p1-mif5000, partitions: 1, routes: {maxInFlight: 5000}}
  - {name: p12, partitions: 12}
