name: s2-confirm
description: >
  S2 confirmation pass — 5-min steps around the knee found by s2-explore (1-min steps), with the full criteria
  (lag slope <= max(50, 1% of rate)/s after a 30 s warm-up for the whole step AND p99 end-to-end < 1 s).
  One route, 1 KB JSON (10 KB for p12-10kb), no filter/transform.
target: local
stopOnKnee: true
criteria: {p99Limit: 1s, lagSlopeAbs: 50, lagSlopeRel: 0.01, warmup: 30s, minSamples: 6}
defaults:
  partitions: 12
  routes: {count: 1, maxInFlight: 1000}
  load: {size: 1024, producers: 2, lanes: 4, streams: 512}
  drain: {timeout: 5m}
cases:
  - name: p1
    partitions: 1
    load: {steps: [{rate: 25000, duration: 5m}, {rate: 30000, duration: 5m}, {rate: 35000, duration: 5m}]}
  - name: p3
    partitions: 3
    load: {steps: [{rate: 40000, duration: 5m}, {rate: 50000, duration: 5m}, {rate: 57500, duration: 5m}]}
  - name: p12
    partitions: 12
    load: {steps: [{rate: 40000, duration: 5m}, {rate: 50000, duration: 5m}, {rate: 57500, duration: 5m}, {rate: 65000, duration: 5m}]}
  - name: p48
    partitions: 48
    load: {steps: [{rate: 40000, duration: 5m}, {rate: 50000, duration: 5m}, {rate: 57500, duration: 5m}]}
  - name: p12-mif100
    partitions: 12
    routes: {maxInFlight: 100}
    load: {steps: [{rate: 5000, duration: 5m}, {rate: 6500, duration: 5m}, {rate: 8000, duration: 5m}]}
  - name: p12-mif5000
    partitions: 12
    routes: {maxInFlight: 5000}
    load: {steps: [{rate: 65000, duration: 5m}, {rate: 72500, duration: 5m}, {rate: 80000, duration: 5m}, {rate: 90000, duration: 5m}]}
  - name: p12-10kb
    partitions: 12
    load: {size: 10240, steps: [{rate: 12000, duration: 5m}, {rate: 15000, duration: 5m}, {rate: 17500, duration: 5m}, {rate: 20000, duration: 5m}]}
