name: wave2-s7
description: >
  Wave-2 S7 quick: kill -9 + restart of the worker at 45k ev/s, and 50 % of events into the DLQ (recipe error) at
  45k ev/s. Zero lost required (measure includes the DLQ). Fast codec, default auto in-flight.
target: local
criteria: {p99Limit: 1s, lagSlopeAbs: 50, lagSlopeRel: 0.01, warmup: 30s, minSamples: 6}
defaults:
  partitions: 12
  routes: {count: 1, onError: dlq}
  measure: {includeDlq: true}
  load: {size: 1024, producers: 3, lanes: 4, streams: 512, steps: [{rate: 45000, duration: 4m}]}
  drain: {timeout: 10m}
cases:
  - name: kill-worker
    actions:
      - {at: 90s, name: kill-worker, run: "kill -9 $(cat .local/run/worker.pid)"}
      - {at: 100s, name: restart-worker, run: "test/stress/scripts/workers.sh restart-main"}
  - name: dlq-50pct-recipe
    load: {badRatio: 0.5}
    routes:
      steps:
        raw:
          - kind: if_else
            condition: {type: cond, field: value.bad, op: eq, value: true}
            thenSteps:
              - {kind: convert_type, field: value.customer.email, targetType: number, onFailure: error}
