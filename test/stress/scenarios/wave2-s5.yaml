name: wave2-s5
description: >
  Wave-2 S5 rule complexity (12 p, 1 KB, default auto in-flight): baseline, 5 / 20 set steps, identity JS (JS pool
  autoscale). 1-min steps (s5-explore method). Run once per ROUTER_ENGINE_CODEC; renamed wave2-s5-<codec>.json.
target: local
stopOnKnee: true
criteria: {p99Limit: 1s, lagSlopeAbs: 50, lagSlopeRel: 0.01, warmup: 20s, minSamples: 6}
defaults:
  partitions: 12
  routes: {count: 1}
  load:
    size: 1024
    producers: 3
    lanes: 4
    streams: 512
    steps:
      - {rate: 20000, duration: 1m}
      - {rate: 40000, duration: 1m}
      - {rate: 57500, duration: 1m}
      - {rate: 72500, duration: 1m}
      - {rate: 90000, duration: 1m}
      - {rate: 110000, duration: 1m}
      - {rate: 130000, duration: 1m}
      - {rate: 160000, duration: 1m}
  drain: {timeout: 3m}
jsSteps: &jsramp
  - {rate: 1000, duration: 1m}
  - {rate: 2000, duration: 1m}
  - {rate: 3000, duration: 1m}
  - {rate: 4000, duration: 1m}
  - {rate: 5000, duration: 1m}
  - {rate: 6500, duration: 1m}
  - {rate: 8000, duration: 1m}
  - {rate: 10000, duration: 1m}
  - {rate: 12500, duration: 1m}
  - {rate: 15000, duration: 1m}
cases:
  - {name: baseline}
  - {name: s5, routes: {steps: {count: 5, kind: set}}}
  - {name: s20, routes: {steps: {count: 20, kind: set}}}
  - {name: js, routes: {js: identity}, load: {steps: *jsramp}}
