name: s8-mini-soak
description: >
  Local 20-minute mini-soak at 70% of the S2 p12 knee (65k -> 45k ev/s), one route, 12 partitions, 1 KB, default
  maxInFlight. Watch RSS / goroutines / heap for growth, lag and p99 drift, and loss. The 8 h version is s8-soak.
target: local
criteria: {p99Limit: 1s, lagSlopeAbs: 50, lagSlopeRel: 0.01, warmup: 2m, minSamples: 6}
sampleInterval: 10s
defaults:
  partitions: 12
  routes: {count: 1}
  load:
    size: 1024
    producers: 2
    lanes: 4
    streams: 512
  drain: {timeout: 10m}
cases:
  - name: soak-20m
    load:
      steps: [{rate: 45000, duration: 20m}]
