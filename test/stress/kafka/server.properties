# Single-node KRaft broker+controller for local stress tests (rendered by test/stress/infra.sh).
# @STRESS_LOG_DIR@ is substituted at start; everything listens on loopback only.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:39093
listeners=PLAINTEXT://127.0.0.1:39092,CONTROLLER://127.0.0.1:39093
advertised.listeners=PLAINTEXT://127.0.0.1:39092,CONTROLLER://127.0.0.1:39093
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
log.dirs=@STRESS_LOG_DIR@
num.partitions=3
auto.create.topics.enable=false
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
offsets.topic.num.partitions=50
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
num.network.threads=4
num.io.threads=8
num.recovery.threads.per.data.dir=2
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576
socket.request.max.bytes=104857600
log.retention.hours=6
log.retention.bytes=8589934592
log.segment.bytes=536870912
log.retention.check.interval.ms=300000
group.initial.rebalance.delay.ms=0
