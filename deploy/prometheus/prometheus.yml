global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/router.rules.yml

scrape_configs:
  - job_name: router-api
    static_configs:
      - targets: ["host.docker.internal:8080", "api:8080"]
  - job_name: router-worker
    static_configs:
      - targets: ["host.docker.internal:8081", "worker:8081"]
  - job_name: router-preview
    static_configs:
      - targets: ["host.docker.internal:8082", "preview:8082"]
