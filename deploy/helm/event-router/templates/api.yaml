{{- $c := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "er.fullname" . }}-api
  labels: {{- include "er.labels" $c | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "er.selector" $c | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "er.selector" $c | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "er.fullname" . }}-api
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "er.scheduling" $c | nindent 6 }}
      containers:
        - name: api
          image: {{ include "er.image" (dict "root" . "image" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
            - { name: internal, containerPort: {{ .Values.api.internalPort }} }
          envFrom: {{- include "er.envFrom" . | nindent 12 }}
          env:
            - { name: ROUTER_SERVICE, value: api }
            - { name: ROUTER_HTTP_ADDR, value: {{ printf ":%v" .Values.api.port | quote }} }
            - { name: ROUTER_INTERNAL_ADDR, value: {{ printf ":%v" .Values.api.internalPort | quote }} }
            {{- include "er.secretKeyRefs" . | nindent 12 }}
            {{- include "er.tlsEnv" (dict "root" . "api" true) | nindent 12 }}
            {{- include "er.componentEnv" .Values.api.env | nindent 12 }}
          {{- include "er.probes" $c | nindent 10 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: {{- include "er.goVolumeMounts" . | nindent 12 }}
      volumes: {{- include "er.goVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "er.fullname" . }}-api
  labels: {{- include "er.labels" $c | nindent 4 }}
spec:
  selector: {{- include "er.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.api.port }}, targetPort: http }
---
# Internal listener (workers/preview only; NetworkPolicy restricts it to them).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "er.fullname" . }}-api-internal
  labels: {{- include "er.labels" $c | nindent 4 }}
spec:
  selector: {{- include "er.selector" $c | nindent 4 }}
  ports:
    - { name: internal, port: {{ .Values.api.internalPort }}, targetPort: internal }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "er.fullname" . }}-api
  labels: {{- include "er.labels" $c | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "er.selector" $c | nindent 6 }}
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "er.fullname" . }}-api
  labels: {{- include "er.labels" $c | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "er.fullname" . }}-api }
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }} }
{{- end }}
