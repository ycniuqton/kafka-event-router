{{- range $component := list "api" "worker" "preview" "web" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "er.fullname" $ }}-{{ $component }}
  labels: {{- include "er.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with include "er.saAnnotations" (dict "root" $ "component" $component) }}{{ . | nindent 2 }}{{ end }}
automountServiceAccountToken: {{ eq $component "api" }}
---
{{- end }}
# The api verifies worker/preview projected tokens with the TokenReview API (k8s_token workload auth).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "er.fullname" . }}-api-tokenreview
  labels: {{- include "er.labels" (dict "root" . "component" "api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "er.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
