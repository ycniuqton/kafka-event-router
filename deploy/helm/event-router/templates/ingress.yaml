{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "er.fullname" . }}
  labels: {{- include "er.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  annotations:
    {{- if .Values.tls.enabled }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $path := list "/api" "/auth" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service: { name: {{ include "er.fullname" $ }}-api, port: { name: http } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "er.fullname" . }}-web, port: { name: http } }
{{- end }}
