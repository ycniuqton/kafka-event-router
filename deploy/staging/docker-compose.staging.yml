# Event Router STAGING stack (single host). Run from the repo root on the server:
#   docker compose -f deploy/staging/docker-compose.staging.yml --env-file /opt/event-router/.env up -d --build
# Only the web container publishes a public host port (80). Everything else lives on the internal
# "backend" network; postgres, redis, kafka (DEV listener), prometheus and api also bind to 127.0.0.1
# on the host so local development can reach them over an ssh tunnel (see deploy/dev/README.md).
# kafka-b is a second, independent Kafka cluster for cross-cluster demos (DEV listener 127.0.0.1:29093);
# demo-producer feeds the demo- topics on both clusters (see README.md "Demo: two Kafka clusters").
name: event-router-staging

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-router-env: &router-env
  ROUTER_ENV: staging
  ROUTER_LOG_LEVEL: ${ROUTER_LOG_LEVEL:-info}
  ROUTER_WORKSPACE_NAME: staging
  ROUTER_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&pool_max_conns=${ROUTER_DB_POOL_MAX_CONNS:-16}
  ROUTER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  ROUTER_KAFKA_BOOTSTRAP: kafka:19092
  ROUTER_PUBLIC_URL: ${STAGING_URL}
  ROUTER_CURSOR_SECRET: ${ROUTER_CURSOR_SECRET}
  ROUTER_COOKIE_SECRET: ${ROUTER_COOKIE_SECRET}
  ROUTER_COOKIE_SECURE: ${ROUTER_COOKIE_SECURE:-false}
  ROUTER_WORKLOAD_AUTH: static_token
  ROUTER_WORKLOAD_TOKEN: ${ROUTER_WORKLOAD_TOKEN}
  ROUTER_CONTROL_PLANE_URL: http://api:8080
  ROUTER_CONTROL_PLANE_INTERNAL_URL: http://api:8443
  ROUTER_SECRETS_PROVIDER: vault
  ROUTER_VAULT_ADDR: http://vault:8200
  ROUTER_VAULT_TOKEN: ${ROUTER_VAULT_TOKEN}
  ROUTER_VAULT_TRANSIT_KEY: event-router
  ROUTER_VAULT_TRANSIT_MOUNT: transit
  ROUTER_PREVIEW_URL: http://preview:8082
  ROUTER_PREVIEW_DIRECTIVE_SECRET: ${ROUTER_PREVIEW_DIRECTIVE_SECRET}
  ROUTER_METRICS_BACKEND: prometheus
  ROUTER_METRICS_URL: http://prometheus:9090
  ROUTER_ROUTE_METRICS_READER: ${ROUTER_ROUTE_METRICS_READER:-prometheus}
  ROUTER_EVENTS_BUS: ${ROUTER_EVENTS_BUS:-redis}
  ROUTER_LIVETAIL_TAP: ${ROUTER_LIVETAIL_TAP:-redis}
  ROUTER_ASSIST_PROVIDER: ${ROUTER_ASSIST_PROVIDER:-mock}
  ROUTER_ALERTS_ENABLED: ${ROUTER_ALERTS_ENABLED:-true}
  ROUTER_ALERTS_CHANNELS: ${ROUTER_ALERTS_CHANNELS:-slack,teams,webhook}
  ROUTER_SMTP_HOST: ${ROUTER_SMTP_HOST:-}

x-go-build: &go-build
  context: ../..
  dockerfile: deploy/docker/go.Dockerfile

x-probe: &probe
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 20s

networks:
  backend:
    name: event-router-staging-backend

volumes:
  pgdata:
  redisdata:
  kafkadata:
  kafkabdata:
  promdata:
  vaultdata:
  workercache:

services:
  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    networks: [backend]
    # Sized for api/worker/preview pools plus local dev processes sharing this server (see README "Postgres sizing").
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "1.0", memory: 1536M } } }

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  kafka:
    <<: [*restart, *logging]
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # DEV is for ssh-tunnel clients (ssh -L 29092:127.0.0.1:29092): advertised as 127.0.0.1:29092.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,DEV://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,DEV://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DEV:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: eventrouter-stage-0001
    volumes: [kafkadata:/var/lib/kafka/data]
    ports: ["127.0.0.1:29092:29092"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    deploy: { resources: { limits: { cpus: "1.0", memory: 1G } } }

  # Second, independent single-node cluster ("cluster B") for cross-cluster demo routes (connection kafka-b).
  # Same KRaft layout as kafka; own cluster id and volume. DEV listener: 127.0.0.1:29093 (ssh -L 29093:127.0.0.1:29093).
  kafka-b:
    <<: [*restart, *logging]
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,DEV://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-b:19092,DEV://127.0.0.1:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DEV:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-b:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: eventrouter-stage-000b
    volumes: [kafkabdata:/var/lib/kafka/data]
    ports: ["127.0.0.1:29093:29093"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-b:19092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    deploy: { resources: { limits: { cpus: "0.75", memory: 768M } } }

  # Low-rate demo traffic (~DEMO_PRODUCER_RATE ev/s per stream): demo-orders on kafka, demo-payments / demo-raw
  # (~10% bad:true) / demo-b-in on kafka-b. Stop: `$C stop demo-producer`; keep it off across redeploys with
  # DEMO_PRODUCER_REPLICAS=0 in /opt/event-router/.env.
  demo-producer:
    <<: [*restart, *logging]
    image: event-router-staging/demoproducer:latest
    build: { <<: *go-build, args: { CMD: demoproducer } }
    environment:
      DEMO_CLUSTERS: "a=kafka:19092;b=kafka-b:19092"
      DEMO_STREAMS: "orders@a/demo-orders,payments@b/demo-payments,raw@b/demo-raw,local@b/demo-b-in"
      DEMO_RATE: ${DEMO_PRODUCER_RATE:-1}
      DEMO_BAD_RATIO: "0.1"
      DEMO_PARTITIONS: "3"
      GOMEMLIMIT: 32MiB
    networks: [backend]
    depends_on:
      kafka: { condition: service_healthy }
      kafka-b: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app", "health"]
      <<: *probe
    deploy:
      replicas: ${DEMO_PRODUCER_REPLICAS:-1}
      resources: { limits: { cpus: "0.1", memory: 48M } }

  prometheus:
    <<: [*restart, *logging]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/router.rules.yml:/etc/prometheus/router.rules.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }

  vault:
    <<: [*restart, *logging]
    image: hashicorp/vault:1.18.3
    command: ["server"]
    environment:
      SKIP_SETCAP: "true"
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - vaultdata:/vault/file
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1; [ $$? -ne 1 ]"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }

  # Initialises Vault once (keys -> /opt/event-router/vault-init.json), then keeps it unsealed and
  # re-applies transit mount, key, policy and app token idempotently on every start.
  vault-init:
    <<: [*restart, *logging]
    image: hashicorp/vault:1.18.3
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      ROUTER_VAULT_TOKEN: ${ROUTER_VAULT_TOKEN}
      TRANSIT_MOUNT: transit
      TRANSIT_KEY: event-router
    volumes:
      - ./vault/init.sh:/init/init.sh:ro
      - ${ER_HOME:-/opt/event-router}/vault-init.json:/state/vault-init.json
    networks: [backend]
    depends_on:
      vault: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/vault-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy: { resources: { limits: { cpus: "0.25", memory: 64M } } }

  dex:
    <<: [*restart, *logging]
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml.tpl"]
    environment:
      DEX_ISSUER: ${STAGING_URL}/dex
      DEX_REDIRECT_URI: ${STAGING_URL}/auth/oidc/callback
      DEX_CLIENT_SECRET: ${DEX_CLIENT_SECRET}
      DEX_STAGING_USER_EMAIL: ${STAGING_LOGIN_EMAIL}
      DEX_STAGING_USER_HASH: ${DEX_STAGING_USER_HASH}
      DEX_STAGING_APPROVER_EMAIL: ${STAGING_APPROVER_EMAIL}
      DEX_STAGING_APPROVER_HASH: ${DEX_STAGING_APPROVER_HASH}
    volumes:
      - ./dex/config.yaml.tpl:/etc/dex/config.yaml.tpl:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5558/healthz"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "0.25", memory: 192M } } }

  migrate:
    <<: *logging
    build: { <<: *go-build, args: { CMD: api, RUNTIME_IMAGE: "gcr.io/distroless/static-debian12:debug-nonroot" } }
    image: event-router-staging/api:latest
    command: ["migrate", "up"]
    environment:
      <<: *router-env
      ROUTER_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: [*restart, *logging]
    image: event-router-staging/api:latest
    build: { <<: *go-build, args: { CMD: api, RUNTIME_IMAGE: "gcr.io/distroless/static-debian12:debug-nonroot" } }
    environment:
      <<: *router-env
      ROUTER_HTTP_ADDR: ":8080"
      ROUTER_INTERNAL_ADDR: ":8443"
      ROUTER_AUTH_MODES: ${ROUTER_AUTH_MODES:-oidc,api_token}
      ROUTER_OIDC_ISSUER: ${STAGING_URL}/dex
      ROUTER_OIDC_CLIENT_ID: event-router
      ROUTER_OIDC_CLIENT_SECRET: ${DEX_CLIENT_SECRET}
      ROUTER_OIDC_REDIRECT_URL: ${STAGING_URL}/auth/oidc/callback
      ROUTER_BOOTSTRAP_ADMIN_EMAILS: ${STAGING_LOGIN_EMAIL}
    ports: ["127.0.0.1:8080:8080"]
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      vault-init: { condition: service_healthy }
      dex: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }

  worker:
    <<: [*restart, *logging]
    image: event-router-staging/worker:latest
    build: { <<: *go-build, args: { CMD: worker, RUNTIME_IMAGE: "gcr.io/distroless/static-debian12:debug-nonroot" } }
    environment:
      <<: *router-env
      ROUTER_HTTP_ADDR: ":8081"
      ROUTER_WORKER_ID: worker-1
      ROUTER_WORKER_ZONE: staging-a
      ROUTER_WORKER_CACHE_DIR: /var/lib/router/cache
    volumes: [workercache:/var/lib/router/cache]
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:8081/readyz"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }

  preview:
    <<: [*restart, *logging]
    image: event-router-staging/preview:latest
    build: { <<: *go-build, args: { CMD: preview, RUNTIME_IMAGE: "gcr.io/distroless/static-debian12:debug-nonroot" } }
    environment:
      <<: *router-env
      ROUTER_HTTP_ADDR: ":8082"
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:8082/readyz"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }

  web:
    <<: [*restart, *logging]
    image: event-router-staging/web:latest
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args: { VITE_DATA_SOURCE: http }
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:8080"]
    networks: [backend]
    # api readiness includes OIDC discovery through this proxy (public issuer URL), so only wait for start.
    depends_on:
      api: { condition: service_started }
      dex: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }
