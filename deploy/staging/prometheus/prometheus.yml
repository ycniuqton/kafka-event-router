# Staging Prometheus: scrapes the router services on the internal compose network.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/router.rules.yml

scrape_configs:
  - job_name: router-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: router-worker
    static_configs:
      - targets: ["worker:8081"]
  - job_name: router-preview
    static_configs:
      - targets: ["preview:8082"]
