name: event-router

# Infra services always start; the application stack is profile "app" (make up),
# Dex for OIDC testing is profile "oidc".

x-router-env: &router-env
  ROUTER_ENV: local
  ROUTER_LOG_LEVEL: info
  ROUTER_DATABASE_URL: postgres://router:router@postgres:5432/router?sslmode=disable
  ROUTER_REDIS_URL: redis://redis:6379/0
  ROUTER_KAFKA_BOOTSTRAP: kafka:19092
  ROUTER_CURSOR_SECRET: ${ROUTER_CURSOR_SECRET:-local-dev-only-secret-change-me}
  ROUTER_COOKIE_SECRET: ${ROUTER_COOKIE_SECRET:-local-dev-only-secret-change-me}
  ROUTER_WORKLOAD_AUTH: static_token
  ROUTER_WORKLOAD_TOKEN: ${ROUTER_WORKLOAD_TOKEN:-local-workload-token}
  ROUTER_CONTROL_PLANE_URL: http://api:8080
  ROUTER_CONTROL_PLANE_INTERNAL_URL: http://api:8443

x-go-build: &go-build
  context: ..
  dockerfile: deploy/docker/go.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: router
      POSTGRES_PASSWORD: router
      POSTGRES_DB: router
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d router"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: eventrouter-local-0001
    volumes: [kafkadata:/var/lib/kafka/data]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/router.rules.yml:/etc/prometheus/router.rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  migrate:
    profiles: ["app"]
    build: { <<: *go-build, args: { CMD: api } }
    image: event-router/api:local
    command: ["migrate", "up"]
    environment: *router-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: ["app"]
    image: event-router/api:local
    build: { <<: *go-build, args: { CMD: api } }
    environment:
      <<: *router-env
      ROUTER_HTTP_ADDR: ":8080"
      ROUTER_INTERNAL_ADDR: ":8443"
      ROUTER_PUBLIC_URL: http://localhost:8080
      ROUTER_AUTH_MODES: ${ROUTER_AUTH_MODES:-dev,oidc}
      ROUTER_SECRETS_PROVIDER: local
      ROUTER_SECRETS_LOCAL_KEY_FILE: /var/lib/router/master.key
      ROUTER_OIDC_ISSUER: ${ROUTER_OIDC_ISSUER:-http://dex:5556/dex}
      ROUTER_OIDC_CLIENT_ID: event-router
      ROUTER_OIDC_CLIENT_SECRET: event-router-dev-secret
      ROUTER_OIDC_REDIRECT_URL: http://localhost:8080/auth/oidc/callback
    ports: ["8080:8080"]
    volumes: [masterkey:/var/lib/router]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    image: event-router/worker:local
    build: { <<: *go-build, args: { CMD: worker } }
    environment:
      <<: *router-env
      ROUTER_HTTP_ADDR: ":8081"
      ROUTER_WORKER_ID: worker-1
      ROUTER_WORKER_ZONE: zone-a
      ROUTER_WORKER_CACHE_DIR: /var/lib/router/cache
    ports: ["8081:8081"]
    volumes: [workercache1:/var/lib/router/cache]
    depends_on: [api, kafka]

  # Second worker for HA testing (leases, failover, one-replica-at-a-time rollout): --profile app --profile ha.
  worker-2:
    profiles: ["ha"]
    image: event-router/worker:local
    build: { <<: *go-build, args: { CMD: worker } }
    environment:
      <<: *router-env
      ROUTER_HTTP_ADDR: ":8081"
      ROUTER_WORKER_ID: worker-2
      ROUTER_WORKER_ZONE: zone-b
      ROUTER_WORKER_CACHE_DIR: /var/lib/router/cache
    ports: ["8091:8081"]
    volumes: [workercache2:/var/lib/router/cache]
    depends_on: [api, kafka]

  preview:
    profiles: ["app"]
    image: event-router/preview:local
    build: { <<: *go-build, args: { CMD: preview } }
    environment:
      <<: *router-env
      ROUTER_HTTP_ADDR: ":8082"
    ports: ["8082:8082"]
    depends_on: [api, kafka]

  web:
    profiles: ["app"]
    image: event-router/web:local
    build: { context: .., dockerfile: deploy/docker/web.Dockerfile }
    ports: ["3000:8080"]
    depends_on: [api]

  dex:
    profiles: ["oidc"]
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports: ["5556:5556"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro

volumes:
  pgdata:
  kafkadata:
  masterkey:
  workercache1:
  workercache2:
