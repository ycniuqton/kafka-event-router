# Lite nginx, plain HTTP on :8080 (published as WEB_BIND:WEB_PORT). Production: put a TLS terminator in front
# (it must send X-Forwarded-Proto: https) or switch to tls.conf via docker-compose.tls.yml (see README).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/router/locations.conf;
}
