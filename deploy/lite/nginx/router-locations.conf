# Locations shared by the lite nginx sites: SPA + /api (incl. WebSocket) and /auth proxied to the api.
# The api's public listener serves HTTPS with the internal CA (ROUTER_TLS_CERT_FILE is shared by both api
# listeners), so the upstream is https and verified against the certs-init CA (name "api").
resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 10m;

set $api_upstream https://api:8080;
proxy_ssl_server_name on;
proxy_ssl_name api;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /etc/nginx/router-certs/ca.crt;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

location = /nginx-health {
    access_log off;
    return 200 "ok\n";
}

location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $router_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1h;
}

location /auth/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $router_forwarded_proto;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
