# http-level maps shared by the lite nginx sites (mounted as conf.d/00-maps.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme a TLS terminator in front reported; fall back to nginx's own scheme.
map $http_x_forwarded_proto $router_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
