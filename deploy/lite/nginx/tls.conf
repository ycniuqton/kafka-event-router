# Lite nginx terminating TLS itself (enabled by docker-compose.tls.yml): HTTPS on :8443, :8080 redirects to it
# (except the health probe). Certificate and key are the operator's files mounted under /etc/nginx/tls.
server {
    listen 8080;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:router_tls:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/router/locations.conf;
}
