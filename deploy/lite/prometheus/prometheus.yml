# Lite Prometheus (compose profile "metrics"): scrapes /metrics of the router services on the backend network.
# The api's public listener is HTTPS with the certs-init CA (shared ROUTER_TLS_* config); worker/preview are plain.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/router.rules.yml

scrape_configs:
  - job_name: router-api
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/ca.crt
      server_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: router-worker
    static_configs:
      - targets: ["worker:8081"]
  - job_name: router-preview
    static_configs:
      - targets: ["preview:8082"]
