# Event Router LITE stack: single host, only Postgres + Redis as infrastructure (no Vault, no OIDC, no own Kafka;
# route Kafka clusters come from user connections). Run from deploy/lite after ./init.sh:
#   docker compose up -d --build                      # core stack
#   docker compose --profile metrics up -d --build    # + Prometheus (or COMPOSE_PROFILES=metrics in .env)
# Only web publishes a non-loopback host port. certs-init issues the internal mTLS certificates once (see README).
name: event-router-lite

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-probe: &probe
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 20s

x-go-build: &go-build
  context: ../..
  dockerfile: deploy/docker/go.Dockerfile

x-db-env: &db-env
  ROUTER_DATABASE_URL: postgres://${POSTGRES_USER:?run ./init.sh}:${POSTGRES_PASSWORD:?run ./init.sh}@postgres:5432/${POSTGRES_DB:?run ./init.sh}?sslmode=disable&pool_max_conns=${ROUTER_DB_POOL_MAX_CONNS:-16}

x-router-env: &router-env
  ROUTER_ENV: ${ROUTER_ENV:-production}
  ROUTER_LOG_LEVEL: ${ROUTER_LOG_LEVEL:-info}
  ROUTER_WORKSPACE_NAME: ${ROUTER_WORKSPACE_NAME:-default}
  ROUTER_REDIS_URL: redis://:${REDIS_PASSWORD:?run ./init.sh}@redis:6379/0
  ROUTER_PUBLIC_URL: ${ROUTER_PUBLIC_URL:?run ./init.sh}
  ROUTER_CURSOR_SECRET: ${ROUTER_CURSOR_SECRET:?run ./init.sh}
  ROUTER_COOKIE_SECRET: ${ROUTER_COOKIE_SECRET:?run ./init.sh}
  ROUTER_COOKIE_SECURE: ${ROUTER_COOKIE_SECURE:-true}
  ROUTER_WORKLOAD_AUTH: mtls
  ROUTER_CONTROL_PLANE_INTERNAL_URL: https://api:8443
  ROUTER_SECRETS_PROVIDER: static_key
  ROUTER_PREVIEW_URL: http://preview:8082
  ROUTER_PREVIEW_DIRECTIVE_SECRET: ${ROUTER_PREVIEW_DIRECTIVE_SECRET:?run ./init.sh}
  ROUTER_METRICS_BACKEND: ${ROUTER_METRICS_BACKEND:-prometheus}
  ROUTER_METRICS_URL: ${ROUTER_METRICS_URL:-http://prometheus:9090}
  ROUTER_ROUTE_METRICS_READER: ${ROUTER_ROUTE_METRICS_READER:-null}
  ROUTER_MONITORING_ATTENTION_DETECTORS: ${ROUTER_MONITORING_ATTENTION_DETECTORS:-}
  ROUTER_EVENTS_BUS: redis
  ROUTER_LIVETAIL_TAP: redis
  ROUTER_ASSIST_PROVIDER: ${ROUTER_ASSIST_PROVIDER:-mock}
  ROUTER_ALERTS_ENABLED: ${ROUTER_ALERTS_ENABLED:-false}
  ROUTER_ALERTS_CHANNELS: ${ROUTER_ALERTS_CHANNELS:-slack,teams,webhook}
  ROUTER_ALERTS_WEBHOOK_SIGNING_KEY: ${ROUTER_ALERTS_WEBHOOK_SIGNING_KEY:-}
  ROUTER_SMTP_HOST: ${ROUTER_SMTP_HOST:-}
  ROUTER_SMTP_PORT: ${ROUTER_SMTP_PORT:-}
  ROUTER_SMTP_USER: ${ROUTER_SMTP_USER:-}
  ROUTER_SMTP_PASSWORD: ${ROUTER_SMTP_PASSWORD:-}
  ROUTER_SMTP_FROM: ${ROUTER_SMTP_FROM:-}

x-secrets-env: &secrets-env
  ROUTER_SECRETS_MASTER_KEY: ${ROUTER_SECRETS_MASTER_KEY:-}
  ROUTER_SECRETS_MASTER_KEY_FILE: ${ROUTER_SECRETS_MASTER_KEY_FILE:-}
  ROUTER_SECRETS_PREVIOUS_MASTER_KEYS: ${ROUTER_SECRETS_PREVIOUS_MASTER_KEYS:-}

x-workload-client-env: &workload-client-env
  ROUTER_CONTROL_PLANE_CA_FILE: /certs/ca.crt

networks:
  backend:
    name: event-router-lite-backend

volumes:
  pgdata:
  redisdata:
  promdata:
  workercache:
  certs:
  certsca:

services:
  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    networks: [backend]
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "1.0", memory: 1536M } } }

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  # One-shot: CA + api server cert + worker/preview client certs into the certs volume (CA key stays in certsca).
  # Existing valid files are kept; only a leaf close to expiry is re-issued by the same CA.
  certs-init:
    <<: *logging
    image: event-router-lite/certs-init:latest
    build:
      context: ./certs
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssl
    command: ["/bin/sh", "/scripts/init-certs.sh"]
    environment:
      CERTS_DIR: /certs
      CA_DIR: /ca
    volumes:
      - ./certs/init-certs.sh:/scripts/init-certs.sh:ro
      - certs:/certs
      - certsca:/ca
    network_mode: none
    restart: "no"
    deploy: { resources: { limits: { cpus: "0.25", memory: 64M } } }

  migrate:
    <<: *logging
    build: { <<: *go-build, args: { CMD: api, RUNTIME_IMAGE: "gcr.io/distroless/static-debian12:debug-nonroot" } }
    image: event-router-lite/api:latest
    command: ["migrate", "up"]
    environment:
      <<: [*router-env, *secrets-env]
      ROUTER_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  api:
    <<: [*restart, *logging]
    image: event-router-lite/api:latest
    build: { <<: *go-build, args: { CMD: api, RUNTIME_IMAGE: "gcr.io/distroless/static-debian12:debug-nonroot" } }
    environment:
      <<: [*router-env, *db-env, *secrets-env]
      ROUTER_HTTP_ADDR: ":8080"
      ROUTER_INTERNAL_ADDR: ":8443"
      ROUTER_TLS_CERT_FILE: /certs/api.crt
      ROUTER_TLS_KEY_FILE: /certs/api.key
      ROUTER_TLS_CLIENT_CA_FILE: /certs/ca.crt
      ROUTER_WORKLOAD_MTLS_ALLOWED: worker,preview
      ROUTER_AUTH_MODES: ${ROUTER_AUTH_MODES:-password,api_token}
      ROUTER_BOOTSTRAP_ADMIN_EMAIL: ${ROUTER_BOOTSTRAP_ADMIN_EMAIL:?run ./init.sh}
      ROUTER_BOOTSTRAP_ADMIN_EMAILS: ${ROUTER_BOOTSTRAP_ADMIN_EMAIL}
      ROUTER_BOOTSTRAP_ADMIN_PASSWORD: ${ROUTER_BOOTSTRAP_ADMIN_PASSWORD:-}
      ROUTER_BOOTSTRAP_ADMIN_PASSWORD_FILE: ${ROUTER_BOOTSTRAP_ADMIN_PASSWORD_FILE:-}
      ROUTER_LOGIN_MAX_FAILURES: ${ROUTER_LOGIN_MAX_FAILURES:-5}
      ROUTER_LOGIN_LOCKOUT: ${ROUTER_LOGIN_LOCKOUT:-15m}
      ROUTER_LOGIN_IP_PER_MINUTE: ${ROUTER_LOGIN_IP_PER_MINUTE:-20}
    volumes: [certs:/certs:ro]
    ports: ["127.0.0.1:${API_HOST_PORT:-8080}:8080"]
    networks: [backend]
    depends_on:
      certs-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # ROUTER_TLS_CERT_FILE also turns the public :8080 listener into HTTPS (shared TLS config), hence https here.
    healthcheck:
      test: ["CMD", "/app", "health", "https://127.0.0.1:8080/readyz"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }

  worker:
    <<: [*restart, *logging]
    image: event-router-lite/worker:latest
    build: { <<: *go-build, args: { CMD: worker, RUNTIME_IMAGE: "gcr.io/distroless/static-debian12:debug-nonroot" } }
    environment:
      <<: [*router-env, *workload-client-env]
      ROUTER_HTTP_ADDR: ":8081"
      ROUTER_CONTROL_PLANE_CLIENT_CERT_FILE: /certs/worker.crt
      ROUTER_CONTROL_PLANE_CLIENT_KEY_FILE: /certs/worker.key
      ROUTER_WORKER_ID: worker-1
      ROUTER_WORKER_ZONE: ${ROUTER_WORKER_ZONE:-lite}
      ROUTER_WORKER_CACHE_DIR: /var/lib/router/cache
    volumes:
      - workercache:/var/lib/router/cache
      - certs:/certs:ro
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:8081/readyz"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }

  preview:
    <<: [*restart, *logging]
    image: event-router-lite/preview:latest
    build: { <<: *go-build, args: { CMD: preview, RUNTIME_IMAGE: "gcr.io/distroless/static-debian12:debug-nonroot" } }
    environment:
      <<: [*router-env, *db-env, *workload-client-env]
      ROUTER_HTTP_ADDR: ":8082"
      ROUTER_CONTROL_PLANE_CLIENT_CERT_FILE: /certs/preview.crt
      ROUTER_CONTROL_PLANE_CLIENT_KEY_FILE: /certs/preview.key
    volumes: [certs:/certs:ro]
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:8082/readyz"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }

  web:
    <<: [*restart, *logging]
    image: event-router-lite/web:latest
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args: { VITE_DATA_SOURCE: http }
    volumes:
      - ./nginx/maps.conf:/etc/nginx/conf.d/00-maps.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/router-locations.conf:/etc/nginx/router/locations.conf:ro
      - certs:/etc/nginx/router-certs:ro
    ports: ["${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8088}:8080"]
    networks: [backend]
    depends_on:
      certs-init: { condition: service_completed_successfully }
      api: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }

  prometheus:
    <<: [*restart, *logging]
    image: prom/prometheus:v2.55.1
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/router.rules.yml:/etc/prometheus/router.rules.yml:ro
      - certs:/etc/prometheus/certs:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"]
    networks: [backend]
    depends_on:
      certs-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      <<: *probe
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }
